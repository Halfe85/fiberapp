<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4f7fb">
  <title>Fiber Planner | Fiberapp</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#15283d;background:#f4f7fb}
    *{box-sizing:border-box}
    body{margin:0}
    a{color:inherit;text-decoration:none}
    .planner-main{padding:0}
  </style>
  <link rel="stylesheet" href="../site-shell.css?v=mobile-tool-title-1">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="./projects.css?v=11"></head>
<body>
  <header class="site-header planner-header"><div class="site-shell"><div class="site-actions"><button class="menu-toggle header-icon" type="button" aria-label="Åpne meny" aria-controls="site-menu" aria-expanded="false" title="Meny"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><a class="home-link header-icon" href="../" aria-label="Hjem" title="Hjem"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 9-7 9 7"/><path d="M5 9v12h14V9"/><path d="M9 21v-8h6v8"/></svg></a><button type="button" class="project-header-back header-icon" id="project-back" title="Tilbake til prosjekter" aria-label="Tilbake til prosjekter" hidden><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7M5 12h14"/></svg></button></div><a class="site-brand" href="../" aria-label="FiberApp forside">FIBER<span>APP</span></a><nav class="site-menu" id="site-menu" aria-label="Verktøymeny" hidden><a href="../finder/">Fiberfinder</a><a href="../planner/" aria-current="page">Fiber Planner</a></nav><h1 class="site-page-title">Fiber Planner</h1><button class="planner-add header-icon" type="button" id="add-project" aria-label="Nytt prosjekt" title="Nytt prosjekt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button><div class="planner-project-actions" id="project-actions" hidden>
  <button type="button" class="planner-add header-icon" id="project-add-toggle" aria-label="Legg til i prosjekt" aria-controls="project-add-menu" aria-expanded="false" title="Legg til i prosjekt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
  <div id="project-add-menu" class="project-create-menu" aria-label="Legg til i prosjekt" hidden>
    <button type="button" id="add-address">+ Adresse</button>
    <button type="button" id="add-equipment">+ Utstyr</button>
  </div>
</div></div></header>
  <main class="site-main planner-main" id="main" aria-label="Prosjekter">
  <section class="projects-view">
    <div class="projects-top"><h2>Prosjekter</h2><span id="project-count" aria-live="polite">0 prosjekter</span></div>
    <p id="project-error" class="project-error" role="alert" hidden></p>
    <div id="project-list" class="project-list" aria-live="polite"></div>
  </section>
  <section id="project-workspace" class="project-workspace" aria-labelledby="workspace-title" hidden>
    <div class="project-workspace-heading">
      <h2 id="workspace-title" tabindex="-1"></h2>
      <p id="workspace-description" hidden></p>
    </div>
    <section class="planner-map-section" aria-label="Prosjektkart">
      <div id="planner-map" class="planner-map" role="region" aria-label="Kartverket prosjektkart"></div>
      <p id="planner-map-message" class="planner-map-message" role="status" aria-live="polite"></p>
    </section>
    <div id="project-items" class="project-items" hidden>
      <section id="project-addresses-section" class="project-items-section" hidden aria-label="Adresser">
        <h3>Adresser</h3><div id="project-addresses" class="project-items-list"></div>
      </section>
      <section id="project-equipment-section" class="project-items-section" hidden aria-label="Utstyr">
        <h3>Utstyr</h3><div id="project-equipment" class="project-items-list"></div>
      </section>
    </div>
  </section>
</main>
  <footer class="site-footer planner-footer" aria-label="Bunnlinje"><div class="site-shell"></div></footer>
  <dialog id="project-dialog" class="project-dialog" aria-labelledby="project-dialog-title">
  <form id="project-form">
    <div class="dialog-head"><h2 id="project-dialog-title">Nytt prosjekt</h2><button type="button" id="project-close" class="close-button" aria-label="Lukk">×</button></div>
    <label for="project-name">Prosjektnavn *</label>
    <input id="project-name" name="name" maxlength="80" type="text" required autocomplete="off" placeholder="F.eks. Solsiden borettslag">
    <label for="project-postcode">Postnummer *</label>
    <input id="project-postcode" name="postcode" type="text" inputmode="numeric" pattern="[0-9]{4}"
           minlength="4" maxlength="4" autocomplete="postal-code" placeholder="F.eks. 1850" required>
    <label for="project-description">Beskrivelse (valgfritt)</label>
    <textarea id="project-description" name="description" maxlength="300" rows="3" placeholder="Kort beskrivelse av prosjektet"></textarea>
    <p id="project-form-error" class="project-error" role="alert" hidden></p>
    <div class="dialog-actions"><button type="button" id="project-delete-open" class="delete-open-button" hidden>Slett prosjekt</button><button type="button" id="project-cancel" class="secondary-button">Avbryt</button><button type="submit" class="primary-button">Opprett prosjekt</button></div>
  </form>
  <form id="project-delete-form" hidden>
    <p class="delete-warning">Dette sletter prosjektet permanent fra denne nettleseren. Skriv inn prosjektets navn nøyaktig for å bekrefte.</p>
    <p class="delete-target-name"><strong id="project-delete-target"></strong></p>
    <label for="project-delete-name">Skriv inn prosjektnavnet for å slette</label>
    <input id="project-delete-name" name="confirmation" type="text" autocomplete="off" spellcheck="false" aria-describedby="project-delete-target" required>
    <p id="project-delete-error" class="project-error" role="alert" hidden></p>
    <div class="dialog-actions">
      <button type="button" id="project-delete-back" class="secondary-button">Tilbake</button>
      <button type="submit" id="project-delete-confirm" class="delete-confirm-button" disabled>Slett prosjekt</button>
    </div>
  </form>
</dialog>
<dialog id="project-item-dialog" class="project-dialog project-item-dialog" aria-labelledby="project-item-title">
  <form id="project-item-form">
    <div class="dialog-head">
      <h2 id="project-item-title">Ny adresse</h2>
      <button type="button" id="project-item-close" class="close-button" aria-label="Lukk">×</button>
    </div>
    <label for="project-item-name" id="project-item-name-label">Adresse *</label>
    <input id="project-item-name" name="name" type="text" required maxlength="120" autocomplete="off" placeholder="Gateadresse">
    <div id="project-equipment-type-fields" hidden>
      <label for="project-equipment-type">Utstyrstype</label>
      <select id="project-equipment-type" name="equipment-type">
        <option value="Annet">Annet</option><option value="ODF">ODF</option>
        <option value="Skjøteboks">Skjøteboks</option><option value="Fordelingsboks">Fordelingsboks</option>
        <option value="Svitsj">Svitsj</option>
      </select>
    </div>
    <div class="project-position-picker">
      <button type="button" id="project-item-pick-location" class="secondary-button">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg>
        Velg posisjon i kartet
      </button>
      <span id="project-item-position" class="project-position-status" aria-live="polite">Ingen kartposisjon valgt</span>
    </div>
    <label for="project-item-note" id="project-item-note-label">Beskrivelse (valgfritt)</label>
    <textarea id="project-item-note" name="note" maxlength="300" rows="3"></textarea>
    <p id="project-item-error" class="project-error" role="alert" hidden></p>
    <div class="dialog-actions">
      <button type="button" id="project-item-cancel" class="secondary-button">Avbryt</button>
      <button type="submit" class="primary-button">Legg til</button>
    </div>
  </form>
</dialog>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>
<script src="../site-menu.js" defer></script>
<script src="./projects.js?v=9" defer></script>
<script src="./project-items.js?v=2" defer></script>
<script src="./map.js?v=3" defer></script>
</body>
</html>
