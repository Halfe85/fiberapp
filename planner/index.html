<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4f7fb">
  <title>Fiber Planner | Fiberapp</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#15283d;background:#f4f7fb}
    *{box-sizing:border-box}
    body{margin:0}
    a{color:inherit;text-decoration:none}
    .planner-main{padding:0}
  </style>
  <link rel="stylesheet" href="../site-shell.css?v=mobile-tool-title-1">
<link rel="stylesheet" href="./projects.css?v=1"></head>
<body>
  <header class="site-header planner-header"><div class="site-shell"><div class="site-actions"><button class="menu-toggle header-icon" type="button" aria-label="Åpne meny" aria-controls="site-menu" aria-expanded="false" title="Meny"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><a class="home-link header-icon" href="../" aria-label="Hjem" title="Hjem"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 9-7 9 7"/><path d="M5 9v12h14V9"/><path d="M9 21v-8h6v8"/></svg></a></div><a class="site-brand" href="../" aria-label="FiberApp forside">FIBER<span>APP</span></a><nav class="site-menu" id="site-menu" aria-label="Verktøymeny" hidden><a href="../finder/">Fiberfinder</a><a href="../planner/" aria-current="page">Fiber Planner</a></nav><h1 class="site-page-title">Fiber Planner</h1><button class="planner-add header-icon" type="button" id="add-project" aria-label="Nytt prosjekt" title="Nytt prosjekt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button></div></header>
  <main class="site-main planner-main" id="main" aria-label="Prosjekter">
  <section class="projects-view">
    <div class="projects-top"><h2>Prosjekter</h2><span id="project-count" aria-live="polite">0 prosjekter</span></div>
    <p id="project-error" class="project-error" role="alert" hidden></p>
    <div id="project-list" class="project-list" aria-live="polite"></div>
  </section>
</main>
  <footer class="site-footer planner-footer" aria-label="Bunnlinje"><div class="site-shell"></div></footer>
  <dialog id="project-dialog" class="project-dialog" aria-labelledby="project-dialog-title">
  <form id="project-form">
    <div class="dialog-head"><h2 id="project-dialog-title">Nytt prosjekt</h2><button type="button" id="project-close" class="close-button" aria-label="Lukk">×</button></div>
    <label for="project-name">Prosjektnavn *</label>
    <input id="project-name" name="name" maxlength="80" type="text" required autocomplete="off" placeholder="F.eks. Solsiden borettslag">
    <label for="project-description">Beskrivelse (valgfritt)</label>
    <textarea id="project-description" name="description" maxlength="300" rows="3" placeholder="Kort beskrivelse av prosjektet"></textarea>
    <p id="project-form-error" class="project-error" role="alert" hidden></p>
    <div class="dialog-actions"><button type="button" id="project-cancel" class="secondary-button">Avbryt</button><button type="submit" class="primary-button">Opprett prosjekt</button></div>
  </form>
</dialog>
<script src="../site-menu.js" defer></script><script src="./projects.js?v=1" defer></script>
</body>
</html>
